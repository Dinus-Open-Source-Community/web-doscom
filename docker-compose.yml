version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: doscom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: doscom-backend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./BackEnd/.env  
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./BackEnd:/app
    command: go run ./cmd/api/main.go

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: doscom-frontend
    restart: unless-stopped
    ports:
      - "4321:4321"
    depends_on:
      - backend
    volumes:
      - ./FrontEnd:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

  adminer:
    image: adminer
    container_name: doscom-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  db_data:
