version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: doscom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: doscom
      POSTGRES_PASSWORD: doscom
      POSTGRES_DB: doscomdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doscom -d doscomdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend (Go)
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: doscom-backend
    restart: unless-stopped
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: doscom
      DB_PASS: doscom
      DB_NAME: doscomdb
      GO_ENV: development
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./BackEnd:/app
    command: go run ./cmd/api/main.go

  # Frontend (Astro)
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: doscom-frontend
    restart: unless-stopped
    ports:
      - "4321:4321"
    depends_on:
      - backend
    volumes:
      - ./FrontEnd:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data: