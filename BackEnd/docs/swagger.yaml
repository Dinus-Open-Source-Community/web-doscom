      summary: Create superadmin user
      tags:
        - Super_Admin
  /api/v1/blogs/:
    post:
      consumes:
        - multipart/form-data
      description:
        Create blog dengan upload gambar baru dan/atau memilih gambar yang
        sudah ada
      parameters:
        - description: Judul Blog
          in: formData
          name: title
          required: true
          type: string
        - description: Slug Blog
          in: formData
          name: slug
          required: true
          type: string
        - description: Konten Blog
          in: formData
          name: content
          required: true
          type: string
        - description: Kategori Blog
          in: formData
          name: kategori
          required: true
          type: string
        - description: Tanggal publish (format RFC3339)
          in: formData
          name: published_at
          type: string
        - description: Status publish
          in: formData
          name: is_published
          type: boolean
        - description: ID Work
          in: formData
          name: id_work
          required: true
          type: integer
        - description: ID Pengurus
          in: formData
          name: id_pengurus
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: Blog created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - ApiKeyAuth: []
      summary: Create a new blog
      tags:
        - Blog
  /api/v1/gallery/:
    get:
      consumes:
        - application/json
      description: Mengambil data gallery berdasarkan tipe tertentu
      parameters:
        - description:
            Gallery type (fun, proker, achievment, work, activity, blog,
            pengurus, etc)
          in: query
          name: type
          required: true
          type: string
        - description: Page number
          in: query
          name: page
          type: integer
        - description: Page limit
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: Successfully fetch gallery data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized, role tidak valid
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch gallery data
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - ApiKeyAuth: []
      summary: Get Gallery By Type
      tags:
        - Gallery
    post:
      consumes:
        - multipart/form-data
      description:
        Upload multiple images or videos to MinIO storage with metadata.
        All files stored in MinIO bucket 'doscom-uploads/gallery'.
      parameters:
        - description:
            Type of gallery (fun, proker, achievment, work, activity, blog,
            pengurus, etc)
          in: formData
          name: gallery_type
          required: true
          type: string
        - description: Description of gallery
          in: formData
          name: description
          required: true
          type: string
        - description: Event date (YYYY-MM-DD)
          in: formData
          name: event_date
          required: true
          type: string
        - collectionFormat: csv
          description: Upload multiple image/video files
          in: formData
          items:
            type: file
          name: files
          required: true
          type: array
      produces:
        - application/json
      responses:
        "200":
          description: Successfully uploaded to MinIO
          schema:
            $ref: "#/definitions/web_doscom_internal_database_model.GalleryResponse"
        "400":
          description: Bad request - missing fields or invalid files
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - authentication required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error - upload failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Upload gallery images/videos
      tags:
        - Gallery
  /api/v1/gallery/{id}:
    delete:
      consumes:
        - application/json
      description: Delete gallery data dan file nya berdasarkan ID
      parameters:
        - description: Gallery ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: Successfully delete Gallery
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Gallery not found
          schema:
            additionalProperties: true
            type: object
      security:
        - BearerAuth: []
      summary: Delete gallery by ID
      tags:
        - Gallery
