definitions:
  model.GalleryResponse:
    properties:
      asset_url:
        type: string
      description:
        type: string
      event_date:
        type: string
      file_size:
        type: integer
      gallery_name:
        type: string
      gallery_type:
        type: string
      id:
        type: integer
      mime_type:
        type: string
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.PengurusPatch:
    properties:
      divisi:
        type: string
      email:
        type: string
      name:
        maxLength: 150
        minLength: 2
        type: string
      period:
        maxLength: 50
        type: string
      position:
        type: string
      sosmed:
        type: string
      url_asset:
        type: string
    type: object
  model.PengurusResponse:
    properties:
      divisi:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      period:
        type: string
      position:
        type: string
      sosmed:
        type: string
      url_asset:
        type: string
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      fullname:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    required:
    - email
    - fullname
    type: object
  model.UserPatch:
    properties:
      email:
        type: string
      fullname:
        type: string
      username:
        type: string
    type: object
  model.UserResponse:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: API Documentation Web Doscom
  title: Web Doscom API
  version: "1.0"
paths:
  /api/v1/admin/:
    get:
      description: Mendapatkan daftar semua user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.UserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get all users
      tags:
      - Super_Admin
    post:
      consumes:
      - application/json
      description: Membuat user baru
      parameters:
      - description: Email, FullName, Role
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create new user
      tags:
      - Super_Admin
  /api/v1/admin/{id}:
    get:
      description: Mendapatkan user berdasarkan ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get user by ID
      tags:
      - Super_Admin
    put:
      consumes:
      - application/json
      description: Mengupdate data user berdasarkan ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.UserPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update user
      tags:
      - Super_Admin
  /api/v1/admin/superadmin:
    post:
      consumes:
      - application/json
      description: Membuat user dengan role superadmin (hanya untuk admin/superadmin)
      parameters:
      - description: User info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create superadmin user
      tags:
      - Super_Admin
  /api/v1/gallery/:
    get:
      consumes:
      - application/json
      description: Mengambil data gallery berdasarkan tipe tertentu
      parameters:
      - description: 'Gallery type (misal: event, pengurus, dokumentasi)'
        in: query
        name: type
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully fetch gallery data
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized, role tidak valid
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch gallery data
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get Gallery By Type
      tags:
      - Gallery
    post:
      consumes:
      - multipart/form-data
      description: Upload multiple images/videos + metadata (gallery_type, description,
        event_date)
      parameters:
      - description: Type of gallery (fun, proker, achievment, work, activity, blog,
          pengurus, etc)
        in: formData
        name: gallery_type
        required: true
        type: string
      - description: Description of gallery
        in: formData
        name: description
        required: true
        type: string
      - description: Event date (YYYY-MM-DD)
        in: formData
        name: event_date
        required: true
        type: string
      - collectionFormat: csv
        description: Upload multiple files
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successfully insert data
          schema:
            $ref: '#/definitions/model.GalleryResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Upload gallery (image only or mixed)
      tags:
      - Gallery
  /api/v1/gallery/{id}:
    delete:
      consumes:
      - application/json
      description: Delete gallery data dan file nya berdasarkan ID
      parameters:
      - description: Gallery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully delete Gallery
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Gallery not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete gallery by ID
      tags:
      - Gallery
