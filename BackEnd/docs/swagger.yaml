  /api/v1/pengurus/:
    get:
      consumes:
      - application/json
      description: Mengambil semua data penguru
      parameters:
      - description: Filter by divisi (optional)
        in: query
        name: divisi
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PengurusResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get all Pengurus
      tags:
      - Pengurus
    post:
      consumes:
      - multipart/form-data
      description: Create pengurus using multipart/form-data (JSON fields + file upload)
      parameters:
      - description: Profile Picture
        in: formData
        name: file
        required: true
        type: file
      - description: User ID (optional)
        in: formData
        name: id_user
        type: integer
      - description: Email (optional)
        in: formData
        name: email
        type: string
      - description: Divisi (required)
        in: formData
        name: divisi
        required: true
        type: string
      - description: Name (required)
        in: formData
        name: name
        required: true
        type: string
      - description: Position (required)
        in: formData
        name: position
        required: true
        type: string
      - description: Sosmed (optional)
        in: formData
        name: sosmed
        type: string
      - description: Period (YYYY-MM-DD)
        in: formData
        name: period
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.PengurusResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create new pengurus
      tags:
      - Pengurus
  /api/v1/pengurus/{id}:
