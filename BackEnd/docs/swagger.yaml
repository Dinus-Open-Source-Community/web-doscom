        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update user
      tags:
      - Koor
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: Login untuk user dengan role Admin atau Super_Admin
      parameters:
      - description: Login credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login berhasil, kembalikan token JWT
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Request body invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Email/password salah atau akses ditolak
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error saat membuat token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Admin login
      tags:
      - Auth
  /api/v1/logout:
    post:
      consumes:
      - application/json
      description: Logout user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
