  /api/v1/pengurus/:
    get:
      consumes:
        - application/json
      description: Mengambil semua data penguru
      parameters:
        - description: Filter by divisi (optional)
          in: query
          name: divisi
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/web_doscom_internal_database_model.PengurusResponse"
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - ApiKeyAuth: []
      summary: Get all Pengurus
      tags:
        - Pengurus
    post:
      consumes:
        - multipart/form-data
      description:
        Create pengurus with profile picture upload to MinIO. All files
        uploaded to MinIO bucket.
      parameters:
        - description: Profile Picture (image file)
          in: formData
          name: file
          required: true
          type: file
        - description: User ID (optional, auto-filled for non-admin)
          in: formData
          name: id_user
          type: integer
        - description: Email (optional, auto-filled for non-admin)
          in: formData
          name: email
          type: string
        - description: "Divisi - Valid values: bph, pemro, jaringan, medcrev, data"
          in: formData
          name: divisi
          required: true
          type: string
        - description: Name (2-150 characters)
          in: formData
          name: name
          required: true
          type: string
        - description:
            "Position - Valid values: ketum, sdm, pr, pm, pm_ang, sekum,
            bendum, sek_ang, ben_ang, kor_pemro, kor_jaringan, kor_medcrev, kor_data,
            anggota, pemro_ang, jaringan_ang, medcrev_ang, data_ang"
          in: formData
          name: position
          required: true
          type: string
        - description:
            "Social Media Platform (optional) - Valid values: instagram,
            linkedin, github. Leave empty for default 'instagram'"
          in: formData
          name: sosmed
          type: string
        - description: Period (YYYY-MM-DD format)
          in: formData
          name: period
          required: true
          type: string
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/web_doscom_internal_database_model.PengurusResponse"
        "400":
          description: Validation error - check divisi, position, or sosmed values
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Create new pengurus
      tags:
        - Pengurus
