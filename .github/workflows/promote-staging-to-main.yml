name: Promote staging to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to staging
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin staging >/dev/null; then
            echo "::error::Branch staging does not exist yet. Push a dev-* branch first."
            exit 1
          fi

          git fetch origin main staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main refs/remotes/origin/main
          git merge --ff-only refs/remotes/origin/staging
          git push origin main:refs/heads/main
